# ─────────────────────────────────────────────────────────────
# Noticeboard App — Docker Compose
# Standalone digital noticeboard application.
#
# Runs on port 2424 with persistent SQLite database and uploads.
#
# Build and start with: docker compose up -d --build
# ─────────────────────────────────────────────────────────────

services:
  noticeboard-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: noticeboard-app:latest
    container_name: noticeboard-app
    ports:
      - "${PORT:-2424}:2424"
    environment:
      - DATABASE_URL=file:/app/data/noticeboard.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-this-to-a-secure-random-string-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:2424}
      - NODE_ENV=production
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@jw.org}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SESSION_TIMEOUT_HOURS=${SESSION_TIMEOUT_HOURS:-720}
    volumes:
      - noticeboard-db:/app/data
      - noticeboard-uploads:/app/public/uploads
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2424/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

volumes:
  noticeboard-db:
  noticeboard-uploads:
